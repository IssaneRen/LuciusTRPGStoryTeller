plugins {
    id 'java'
    id 'application'
}

group = 'com.lucius.trpg'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.lucius.trpg.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.formdev:flatlaf:3.6'
    implementation 'com.google.code.gson:gson:2.11.0'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.lucius.trpg.Main'
    }
}
